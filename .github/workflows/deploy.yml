name: Deploy (FTP)

# Manual only: Actions tab → "Deploy (FTP)" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list what would change, upload nothing)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION || '8.3' }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: php tests/run.php

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ inputs.dry_run }}
          # config.local.php lives only on the server and is never uploaded or deleted.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            tests/**
            docs/**
            *.md
            *.bat
            composer.json
            composer.lock
            config.local.php
